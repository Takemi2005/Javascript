<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrizes 4 - Exemplo</title>
</head>
<body>
    <input type="text" id="matrizdiagonal" placeholder="Digite 16 numeros separados por virgula (4×4)">
    <button onclick="somardiagonalPrincipalMatriz()">Diagonal Principal</button>
    <p id="resultadoDiagonal"></p>

    <script>
        function somardiagonalPrincipalMatriz() {
        const vetor = document.getElementById("matrizdiagonal").value.split(",").map(Number);   
        const matriz = [];
        for (let i = 0; i < 4; i++) {
            matriz[i] = vetor.slice(i * 4,(i + 1) * 4);
        }
        let soma = 0;
        for (let i = 0; i < 4; i++) {
            soma += matriz[i][i];
        }
        document.getElementById("resultadoDiagonal").innerHTML = "Diagonal Principal: " + soma;
    }
    </script>
   
</body>
</html>
