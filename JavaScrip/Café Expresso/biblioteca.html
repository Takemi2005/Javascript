<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Leitura Feliz</title>
    
</head>
<body>
    <h1>Biblioteca Leitura Feliz</h1>
    <form onsubmit="event.preventDefault(); verificarEmprestimo();">
        <label for="tipoUsuario">Tipo de Usuário:</label>
        <select id="tipoUsuario" required>
            <option value="">Selecione</option>
            <option value="estudante">Estudante</option>
            <option value="professor">Professor</option>
            <option value="visitante">Visitante</option>
        </select>
        <br><br>
        <label for="quantidadeLivros">Quantidade de Livros:</label>
        <input type="number" id="quantidadeLivros" min="1" required>
        <br><br>
        <button type="submit">Verificar Empréstimo</button>
    </form>
    <script src="biblioteca.js"></script>
</body>
</html>
