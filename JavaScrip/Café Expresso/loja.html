<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Brinquedos</title>
    <script src="script.js" defer></script>
</head>
<body>

    <h2>Loja de Brinquedos</h2>

    <!-- Formulário para adicionar produtos -->
    Código: <input type="number" id="codigo" placeholder="Código"><br>
    Preço: <input type="number" id="preco" placeholder="Preço" step="0.01"><br>
    <button onclick="adicionarItem()">Adicionar Produto</button>

    <h3>Itens na Compra</h3>
    <ul id="listaItens"></ul>

    <h3>Total: R$ <span id="total">0.00</span></h3>
    <button onclick="calcularTotal()">Calcular Total</button>
<script src="loja.js"></script>
</body>
</html>
