<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineShow - Preço do Ingresso</title>
</head>
<body>
    <h1>CineShow - Verifique o Preço do Ingresso</h1>
    <form id="ticketForm">
        <label for="age">Idade:</label>
        <input type="number" id="age" name="age" required>
        <br><br>
        <label for="student">É estudante?</label>
        <select id="student" name="student" required>
            <option value="yes">Sim</option>
            <option value="no">Não</option>
        </select>
        <br><br>
        <button type="button" onclick="calculateTicketPrice()">Calcular Preço</button>
    </form>
    <p id="result"></p>

   <script src="cine.js"></script>
</body>
</html>
