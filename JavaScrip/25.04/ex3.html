<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Menu de Opções</title>
</head>
<body>
    opção (1-3): <input type="number" id="opcaoEscolhida" min="1" max="3" value="2"><br><br>
    <button onclick="exibirOpcao()">Executar Opção</button>
    <div id="resultadoOpcao"></div>

    <script>
        function executarOpcao() {
            let opcao = parseInt(document.getElementById("opcaoEscolhida").value);
            let mensagem;
            switch (opcao) {
               case 1:
                mensagem = "imprimindo..."
                break;
                case 2:
                mensagem = "salvando..."
                break;
                case 3:
                mensagem = "saindo..."
                break;
                default:
                mensagem = "Opção inválida.";
            } 
            document.getElementById("resultadoOpcao").innerHTML =
             `Ação: <strong>${mensagem}</strong>`; 
        }
    </script>
</body>
</html>
