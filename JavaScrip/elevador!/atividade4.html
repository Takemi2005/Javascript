<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="atividade4.css">
    

</head>
<body>
    <h1>Calculadora de IMC</h1>
    <form onsubmit="event.preventDefault(); calcularIMC();">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required><br><br>

        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" step="0.1" required><br><br>

        <label for="altura">Altura (m):</label>
        <input type="number" id="altura" step="0.01" required><br><br>

        <button type="submit">Calcular IMC</button>
    </form>
    <p id="resultado"></p>

    <script src="atividade4.js"></script>
</body>
</html></form>
