<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contar os valores ímpares</title>
</head>
<body>
    <input type="text" id="matrizImpares" placeholder="Digite 5 numeros separados por virgula (4×4)">
    <button onclick="ContarImparesMatriz()">Contar Impares</button>
    <p id="resultadoImparesMatriz"></p>
   
    <script>
        let matriz = [];
        function ContarImparesMatriz() {
            const vetor = document.getElementById("matrizImpares").value.split(",").map(Number);
            for (let i = 0; i < 4; i++) {
                matriz[i] = vetor.slice(i * 4,(i + 1) * 4);
            }
            let impares = 0;
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (matriz[i][j] % 2 === 0) {
                        impares++;
                    }
                }
            }
            document.getElementById("resultadoImparesMatriz").innerHTML = "Quantidade de impares: " + impares;
        }
        
    </script>
   
</body>
</html>
