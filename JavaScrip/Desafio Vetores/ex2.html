<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retornar somente o maior valor da lista</title>
</head>
<body>
    <input type="text" id="vetorMaior" placeholder="Digite os números separados por vírgula">
    <button onclick="encontrarMaiorValordaLista()">Encontrar Maior Valor</button>
    <p id="resultadoMaior"></p>

    <script>
        function encontrarMaiorValordaLista() {
            const vetor = document.getElementById("vetorMaior").value.split(",").map(Number);
            let maior = vetor[0];
           for (let i = 0; i < vetor.length; i++) {
                if (vetor[i] > maior) {
                    maior = vetor[i];
                }
            }
            document.getElementById("resultadoMaior").innerHTML = "Maior: " + maior;
        }
    </script>
</html>
